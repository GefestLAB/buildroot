listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

local_umask=022

dirmessage_enable=YES
use_localtime=YES

xferlog_enable=YES

connect_from_port_20=YES

secure_chroot_dir=/mnt/sd
pam_service_name=vsftpd

ftpd_banner=Welcome to gLab FTP Server

# если хочешь заходить в / (rootfs)
local_root=/

# чтобы можно было писать
allow_writeable_chroot=YES
